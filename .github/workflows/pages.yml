name: Deploy NEXA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check app.js
          node --check service-worker.js
          node --check tests/smoke.js

      - name: Install smoke dependencies
        run: npm install --no-save --no-package-lock jsdom@22

      - name: Run smoke test
        run: node tests/smoke.js

  deploy:
    needs: smoke
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare artifact
        run: |
          rm -rf .data __pycache__ .git .github
          rm -f local_server.py local_library.py
          rm -rf .pytest_cache
          find . -name '*.pyc' -delete

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
